[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fileconv"
version = "0.1.0"
description = "Offline desktop file converter: your files never leave your computer."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "Pillow>=11.0",
    "pillow-heif>=0.18",
    "PyMuPDF>=1.24",
    "pdf2docx>=0.5.8",
    "PySide6-Essentials>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "python-docx>=1.1",
    "ruff>=0.6",
    "pyinstaller>=6.10",
]

[project.scripts]
fileconv = "fileconv.cli:main"

[project.gui-scripts]
fileconv-gui = "fileconv.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fileconv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
