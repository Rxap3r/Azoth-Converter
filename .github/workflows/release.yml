name: Release

# Publish a new version: Actions -> Release -> Run workflow (on main).
# Runs every test on Linux and Windows, builds and tests the installer, then
# creates the tag v<version> and a GitHub Release with the installer and a
# portable ZIP. The version comes from src/azoth/__init__.py; the release notes
# from docs/releases/v<version>.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

# Time limit: normally ~1-5 min (Linux) / ~5-15 min (Windows); the rest is room for slow downloads.
# If the tests or the build really get slower, raise it (see CLAUDE.md → "Time limits").
jobs:
  preflight:
    name: Check version and release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are only made from main (selected: $GITHUB_REF_NAME)."; exit 1
          fi
          version=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/azoth/__init__.py').read()).group(1))")
          project=$(python3 -c "import re;print(re.search(r'^version = \"(.+?)\"', open('pyproject.toml').read(), re.M).group(1))")
          if [ "$version" != "$project" ]; then
            echo "::error::Version mismatch: __init__.py has $version, pyproject.toml has $project."; exit 1
          fi
          if [ ! -f "docs/releases/v$version.md" ]; then
            echo "::error::Release notes docs/releases/v$version.md are missing."; exit 1
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Version $version is already released. Raise the version first."; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing version $version"

  tests-linux:
    name: Tests (Linux)
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests

  tests-windows:
    name: Tests (Windows)
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests

  # Built and tested at the same time as the test suites, to save time.
  build:
    name: Build and test installer
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-windows
        with:
          portable: "true"

  # Only runs when ALL tests and the installer test passed, and publishes exactly
  # the files that were built and tested above.
  publish:
    name: Publish release
    needs: [preflight, tests-linux, tests-windows, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the tag and the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          setup="release-files/AzothConverter-Setup-$VERSION.exe"
          portable="release-files/AzothConverter-portable-$VERSION.zip"
          ls -l release-files
          test -f "$setup" && test -f "$portable"
          gh release create "v$VERSION" "$setup" "$portable" \
            --target "$GITHUB_SHA" \
            --title "Azoth Converter $VERSION" \
            --notes-file "docs/releases/v$VERSION.md"
