name: Tests

# Reusable: lint and the full test suite on one operating system.
on:
  workflow_call:
    inputs:
      os:
        description: "Runner, e.g. ubuntu-latest or windows-latest"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install LibreOffice (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer libreoffice-calc libreoffice-impress \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install LibreOffice (Windows)
        if: runner.os == 'Windows'
        run: choco install libreoffice-fresh --no-progress -y

      - name: Install Python packages
        # Exact versions with checked hashes (see requirements-dev.lock)
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Tests
        run: pytest -v

