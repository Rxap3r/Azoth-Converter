name: CI

# Tests run on every push to main/dev. The Windows app (~190 MB) is only built
# for main, or when started by hand: Actions tab → CI → "Run workflow" → pick a
# branch. That keeps artifact storage small (private repos have a storage quota).
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install LibreOffice (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer libreoffice-calc libreoffice-impress \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install LibreOffice (Windows)
        if: runner.os == 'Windows'
        run: choco install libreoffice-fresh --no-progress -y

      - name: Install Python packages
        # Exact versions with checked hashes (see requirements-dev.lock)
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Tests
        run: pytest -v

  build-windows:
    name: Windows app
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps .
      - name: Build
        working-directory: packaging
        run: pyinstaller fileconv.spec --noconfirm
      - name: Smoke test the built program
        shell: pwsh
        run: |
          $exe = "packaging/dist/FileConverter/fileconv.exe"
          & $exe --version
          & $exe formats
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build installer
        shell: pwsh
        working-directory: packaging
        run: |
          $version = python -c "import fileconv; print(fileconv.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Test installer (install, run, uninstall)
        shell: pwsh
        run: |
          $setup = "packaging/Output/FileConverter-Setup-$env:VERSION.exe"
          $dir = "$env:RUNNER_TEMP\fc-install"
          Start-Process $setup -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART", "/DIR=$dir"
          & "$dir\fileconv.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "installed program does not start" }
          Start-Process "$dir\unins000.exe" -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\fileconv.exe") { throw "uninstall left files behind" }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FileConverter-Setup
          path: packaging/Output/FileConverter-Setup-*.exe
          compression-level: 0  # already compressed
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}
      - name: Upload portable version (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: FileConverter-portable
          path: packaging/dist/FileConverter
          retention-days: 30
