name: CI

# - Every push to dev or main: fast Linux tests (~2 min).
# - Pull requests into main and pushes to main: also Windows tests and the
#   Windows installer build with the install/uninstall test.
# - Started by hand (Actions -> CI -> Run workflow): the full check for any branch.
# - Changes that only touch documentation start no run at all.
# Releases are published by the separate "Release" workflow.
# The steps themselves live in .github/actions/ (run-tests, build-windows).
on:
  push:
    branches: [main, dev]
    paths-ignore: ["docs/**", "**.md", "LICENSE"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests

  tests-windows:
    name: Tests (Windows)
    if: >-
      github.ref == 'refs/heads/main' || github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests

  windows-app:
    name: Windows app
    needs: [tests-linux, tests-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-windows
