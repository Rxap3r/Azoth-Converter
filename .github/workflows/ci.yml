name: CI

# Tests run on every push to main/dev. The Windows app (~190 MB) is only built
# for main, or when started by hand: Actions tab → CI → "Run workflow" → pick a
# branch. That keeps artifact storage small (private repos have a storage quota).
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install LibreOffice (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer libreoffice-calc libreoffice-impress \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install LibreOffice (Windows)
        if: runner.os == 'Windows'
        run: choco install libreoffice-fresh --no-progress -y

      - name: Install Python packages
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Tests
        run: pytest -v

  build-windows:
    name: Windows app
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install . pyinstaller
      - name: Build
        working-directory: packaging
        run: pyinstaller fileconv.spec --noconfirm
      - name: Smoke test the built program
        shell: pwsh
        run: |
          $exe = "packaging/dist/FileConverter/fileconv.exe"
          & $exe --version
          & $exe formats
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: FileConverter-windows
          path: packaging/dist/FileConverter
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}
