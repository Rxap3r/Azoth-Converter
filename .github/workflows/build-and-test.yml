name: Build and test

# - Every push to dev or main: fast Linux tests (~1 min).
# - Pull requests into main and pushes to main: also Windows tests and the
#   Windows installer build with the install/uninstall test.
# - Started by hand (Actions -> Build and test -> Run workflow): the full check for any branch.
# - Pushes that only touch documentation start no run. Pull requests into main
#   ALWAYS get the full check, so the checks can be required before merging.
# Releases are published by the separate "Release" workflow.
# The steps themselves live in .github/actions/ (run-tests, build-windows).
# Runs that build the Windows download (installer + portable ZIP) get a title
# starting with "📦 With download", so they are easy to find (and to clean up).
# Other runs keep GitHub's normal title (an empty run-name means "use the default").
run-name: >-
  ${{ (github.ref == 'refs/heads/main' || github.event_name == 'pull_request' ||
  github.event_name == 'workflow_dispatch')
  && format('📦 With download · {0}', github.event.pull_request.title ||
  (github.event_name == 'push' && 'push to main') || format('test build of {0}', github.ref_name))
  || '' }}
on:
  push:
    branches: [main, dev]
    paths-ignore: ["docs/**", "**.md", "LICENSE"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run that's still going.
# Test builds started by hand have their own slot, so a push doesn't cancel them.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Time limit: normally ~1-5 min (Linux) / ~5-15 min (Windows); the rest is room for slow downloads.
# If the tests or the build really get slower, raise it (see CLAUDE.md → "Time limits").
jobs:
  tests-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests

  tests-windows:
    name: Tests (Windows)
    if: >-
      github.ref == 'refs/heads/main' || github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests

  # Runs at the same time as the tests (it doesn't depend on them), which saves
  # several minutes. A pull request still needs all three checks to be green.
  windows-app:
    name: Windows app
    if: >-
      github.ref == 'refs/heads/main' || github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-windows
        with:
          # Manual test builds also offer the portable ZIP for download.
          portable: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
