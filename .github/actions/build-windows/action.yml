name: Build Windows app
description: >-
  Builds the app and the installer, tests install -> run -> uninstall (including leftover
  checks), makes and tests the portable ZIP (with portable.txt, which the installer never
  has) and uploads the installer. With `portable: "true"` it also uploads the portable ZIP
  (used by the Release workflow, which publishes exactly these tested files).
  Runs on windows-latest; check out the code first.
inputs:
  portable:
    description: '"true" to also upload the portable ZIP (and keep artifacts 30 days)'
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - name: Install
      shell: pwsh
      run: |
        pip install --require-hashes -r requirements-dev.lock
        pip install --no-deps .
    - name: Fetch OCR language files
      shell: pwsh
      run: python packaging/fetch_tessdata.py
    - name: Build
      working-directory: packaging
      shell: pwsh
      run: pyinstaller azoth.spec --noconfirm
    - name: Smoke test the built program
      shell: pwsh
      run: |
        $exe = "packaging/dist/AzothConverter/azoth-terminal.exe"
        & $exe --version
        & $exe formats
        if ($LASTEXITCODE -ne 0) { exit 1 }
        # Without a command it explains itself instead of opening the app
        $note = & $exe | Out-String
        if ($LASTEXITCODE -ne 0 -or $note -notmatch "terminal version") {
          Write-Error "azoth-terminal.exe without a command: note missing"
          exit 1
        }
        # Text recognition works with the bundled language files
        $ocr = "$env:RUNNER_TEMP\ocr-smoke"
        & $exe convert samples/pdf/scanned_letter_no_text.pdf --to txt -o $ocr --quiet
        if ($LASTEXITCODE -ne 0) { exit 1 }
        if (-not (Select-String -Path "$ocr\scanned_letter_no_text.txt" -Pattern "Thank you" -Quiet)) {
          Write-Error "OCR smoke test: text not recognised"
          exit 1
        }
        # AI enhancing works with the bundled model
        $ai = "$env:RUNNER_TEMP\ai-smoke"
        & $exe convert samples/images/logo_transparent.png --to webp --resize 200% --ai -o $ai --quiet
        if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$ai\logo_transparent.webp")) {
          Write-Error "AI smoke test failed"
          exit 1
        }
    - name: Build installer
      shell: pwsh
      working-directory: packaging
      run: |
        $version = python -c "import azoth; print(azoth.__version__)"
        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) {
          choco install innosetup --no-progress -y
        }
        & $iscc "/DAppVersion=$version" installer.iss
        if ($LASTEXITCODE -ne 0) { exit 1 }
        "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
    - name: Test installer (install, run, uninstall)
      shell: pwsh
      run: |
        $setup = "packaging/Output/AzothConverter-Setup-$env:VERSION.exe"
        $dir = "$env:RUNNER_TEMP\fc-install"
        Start-Process $setup -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART", "/DIR=$dir"
        & "$dir\azoth-terminal.exe" --version
        if ($LASTEXITCODE -ne 0) { throw "installed program does not start" }
        if (Test-Path "$dir\portable.txt") { throw "the installer must not be portable" }
        # Explorer right-click menu (installer task, on by default), one menu per kind of file.
        $menus = "HKCU:\Software\Classes\SystemFileAssociations"
        $menu = "$menus\.pdf\shell\AzothConverter"
        if (-not (Test-Path "$menu\shell\90open\command")) { throw "right-click menu missing" }
        $cmd = (Get-ItemProperty "$menu\shell\90open\command").'(default)'
        if ($cmd -ne "`"$dir\AzothConverter.exe`" --explorer open `"%1`"") { throw "wrong menu command: $cmd" }
        # Update over an existing installation: old libraries go, settings stay.
        $data = "$env:APPDATA\Azoth Converter"
        New-Item -ItemType Directory -Force "$data" | Out-Null
        "keep me" | Out-File "$data\settings.ini"
        "x" | Out-File "$dir\_internal\left-from-old-version.dll"
        "x" | Out-File "$dir\azoth.exe"  # the command-line program's name before 0.4.0
        Start-Process $setup -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART", "/DIR=$dir"
        if (Test-Path "$dir\_internal\left-from-old-version.dll") { throw "update left an old library behind" }
        if (Test-Path "$dir\azoth.exe") { throw "update left the old azoth.exe behind" }
        if ((Get-Content "$data\settings.ini") -ne "keep me") { throw "update changed the settings" }
        & "$dir\azoth-terminal.exe" --version
        if ($LASTEXITCODE -ne 0) { throw "updated program does not start" }
        "Update: old libraries removed, settings kept"
        # Simulate everything the app can leave behind while being used:
        "x" | Out-File "$data\error-log.txt"
        "x" | Out-File "$data\QtProject.ini"
        New-Item -ItemType Directory -Force "$env:TEMP\azoth-crashed-job" | Out-Null
        "x" | Out-File "$env:TEMP\azoth-crashed-job\leftover.tmp"
        "x" | Out-File "$dir\created-later.log"
        Start-Process "$dir\unins000.exe" -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
        Start-Sleep -Seconds 5
        $left = @()
        if (Test-Path "$dir") { $left += "program folder" }
        if (Test-Path "$data") { $left += "settings folder" }
        if (Test-Path "$env:TEMP\azoth-crashed-job") { $left += "temp folder" }
        if (Test-Path "HKCU:\Software\Azoth Converter") { $left += "registry key" }
        $menusLeft = Get-ChildItem $menus -ErrorAction SilentlyContinue |
          Where-Object { Test-Path "$($_.PSPath)\shell\AzothConverter" }
        if ($menusLeft) { $left += "right-click menu ($($menusLeft.Count) file types)" }
        $entries = Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" |
          Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -eq "Azoth Converter" }
        if ($entries) { $left += "Apps & features entry" }
        if ($left.Count -gt 0) { throw "uninstall left behind: $($left -join ', ')" }
        "Clean uninstall: nothing left behind"
    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: AzothConverter-Setup
        path: packaging/Output/AzothConverter-Setup-*.exe
        compression-level: 0  # already compressed
        retention-days: ${{ inputs.portable == 'true' && 30 || 7 }}
    - name: Make portable ZIP
      shell: pwsh
      run: |
        # Same program as the installer, plus portable.txt (only in the ZIP, never in the
        # installer): it tells the app to keep its data next to itself (see portable.py).
        $stage = "$env:RUNNER_TEMP\portable-stage"
        Copy-Item -Recurse "packaging/dist/AzothConverter" $stage
        @(
          "This file makes Azoth Converter portable.",
          "Settings, the error log and temporary files are kept in the 'data' folder here,",
          "not on the computer. To remove the app, delete this folder.",
          "Delete this file to use the normal settings folder (%APPDATA%) instead."
        ) | Out-File -Encoding utf8 "$stage\portable.txt"
        Compress-Archive -Path "$stage\*" `
          -DestinationPath "packaging/Output/AzothConverter-portable-$env:VERSION.zip"
    - name: Test portable ZIP (unzip, run, nothing left on the PC)
      shell: pwsh
      run: |
        $dir = "$env:RUNNER_TEMP\portable test\Azoth Converter"
        Expand-Archive "packaging/Output/AzothConverter-portable-$env:VERSION.zip" $dir
        if (-not (Test-Path "$dir\portable.txt")) { throw "portable.txt missing in the ZIP" }
        $appdata = "$env:APPDATA\Azoth Converter"
        if (Test-Path $appdata) { Remove-Item -Recurse -Force $appdata }
        $tempBefore = @(Get-ChildItem $env:TEMP -Filter "azoth-*" -Name)
        & "$dir\azoth-terminal.exe" convert samples/images/photo.png --to jpg --resize 50% `
          -o "$env:RUNNER_TEMP\portable-out" --quiet
        if ($LASTEXITCODE -ne 0) { throw "portable program could not convert" }
        $app = Start-Process "$dir\AzothConverter.exe" -PassThru
        Start-Sleep -Seconds 15
        if ($app.HasExited) { throw "portable app closed by itself (exit code $($app.ExitCode))" }
        Stop-Process -Id $app.Id -Force
        Start-Sleep -Seconds 3
        $left = @()
        if (-not (Test-Path "$dir\data\temp")) { $left += "no data folder: not portable" }
        if (Test-Path $appdata) { $left += "settings folder in %APPDATA%" }
        $tempAfter = @(Get-ChildItem $env:TEMP -Filter "azoth-*" -Name)
        $newTemp = @($tempAfter | Where-Object { $tempBefore -notcontains $_ })
        if ($newTemp.Count -gt 0) { $left += "temp folder in %TEMP%" }
        if (Test-Path "HKCU:\Software\Azoth Converter") { $left += "registry key" }
        if ($left.Count -gt 0) { throw "portable app: $($left -join ', ')" }
        "Portable app: data next to the program, nothing left on the PC"
    - name: Upload portable ZIP
      if: inputs.portable == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: AzothConverter-portable
        path: packaging/Output/AzothConverter-portable-*.zip
        compression-level: 0  # already compressed
        retention-days: 30
